<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>משחק הממלכה — בניית עיר על פי התורה</title>
<style>
  :root{
    --gold:#d4af37;
    --dark:#1d2b3a;
    --panel:#243a52;
    --panel2:#2e4a66;
    --good:#3fb950;
    --bad:#e5534b;
    --txt:#f3f6fb;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:"Segoe UI","Arial",sans-serif;
    background:linear-gradient(160deg,#0d1b2a,#1b3a4b);
    color:var(--txt); user-select:none; overflow:hidden;
  }
  #game{display:flex; height:100vh; width:100vw;}

  /* ===== Side panel ===== */
  #side{
    width:280px; min-width:280px; background:var(--panel);
    display:flex; flex-direction:column; border-left:3px solid var(--gold);
    overflow-y:auto;
  }
  #title{
    text-align:center; padding:10px; font-size:20px; font-weight:bold;
    color:var(--gold); border-bottom:2px solid #0003; background:#0002;
  }
  #title small{display:block; font-size:11px; color:#cdd; font-weight:normal;}

  .stats{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:8px;}
  .stat{
    background:var(--panel2); border-radius:10px; padding:6px 8px; font-size:13px;
    display:flex; flex-direction:column; gap:2px;
  }
  .stat b{font-size:16px;}
  .stat .lbl{font-size:11px; color:#bcd;}

  /* Torah meter */
  #torahBox{padding:6px 10px;}
  #torahBar{height:18px; background:#0003; border-radius:10px; overflow:hidden; border:1px solid #0004;}
  #torahFill{height:100%; width:50%; background:linear-gradient(90deg,#e5534b,#d4af37,#3fb950); transition:width .4s;}
  #torahTxt{font-size:12px; text-align:center; margin-top:3px;}

  /* building palette */
  .section-title{padding:6px 10px 2px; color:var(--gold); font-size:13px; font-weight:bold;}
  #palette{display:grid; grid-template-columns:1fr 1fr; gap:6px; padding:6px 8px;}
  .bld{
    background:var(--panel2); border:2px solid transparent; border-radius:10px;
    padding:6px 4px; cursor:pointer; text-align:center; transition:.15s; font-size:11px;
  }
  .bld:hover{background:#3a5a7a;}
  .bld.sel{border-color:var(--gold); background:#3a5a7a;}
  .bld .ico{font-size:22px; display:block;}
  .bld .cost{color:var(--gold); font-size:10px;}

  /* time controls */
  #time{padding:8px; border-top:2px solid #0003; margin-top:auto;}
  #speedRow{display:flex; gap:4px; justify-content:center; margin-top:6px;}
  .spd{
    flex:1; background:var(--panel2); border:2px solid transparent; border-radius:8px;
    padding:8px 0; cursor:pointer; text-align:center; font-size:14px;
  }
  .spd.sel{border-color:var(--gold); background:#3a5a7a;}
  #clock{text-align:center; font-size:14px;}
  #clock b{color:var(--gold); font-size:18px;}

  /* ===== Main map ===== */
  #main{flex:1; position:relative; display:flex; align-items:center; justify-content:center; overflow:hidden;}
  #canvas{background:#7ec850; border-radius:8px; box-shadow:0 0 40px #0008; touch-action:none;}
  #weatherIco{position:absolute; top:12px; left:12px; font-size:30px; filter:drop-shadow(0 2px 4px #0008); z-index:5;}
  #toast{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    background:#000a; padding:10px 18px; border-radius:12px; font-size:15px;
    border:1px solid var(--gold); opacity:0; transition:.4s; pointer-events:none; max-width:80%; text-align:center;
    z-index:10;
  }
  #toast.show{opacity:1;}
  #hint{position:absolute; top:12px; right:12px; background:#0007; padding:6px 12px; border-radius:10px; font-size:13px; z-index:5;}

  /* event popup */
  #overlay{
    position:absolute; inset:0; background:#000a; display:none;
    align-items:center; justify-content:center; z-index:20;
  }
  #event{
    background:var(--panel); border:3px solid var(--gold); border-radius:16px;
    padding:22px; max-width:420px; text-align:center;
  }
  #event h2{margin:0 0 8px; color:var(--gold);}
  #event p{font-size:15px; line-height:1.5;}
  #event button{
    background:var(--gold); color:#1d2b3a; border:none; border-radius:10px;
    padding:10px 24px; font-size:16px; font-weight:bold; cursor:pointer; margin-top:10px;
  }
  #event button:hover{filter:brightness(1.1);}
  .btn{cursor:pointer;}
  #delMode{margin:6px 8px 0; text-align:center; background:var(--bad); border-radius:8px; padding:6px; cursor:pointer; font-size:13px;}
  #delMode.on{background:#ff7b72; color:#1d2b3a; font-weight:bold;}
</style>
</head>
<body>
<div id="game">
  <!-- ========== SIDE PANEL ========== -->
  <div id="side">
    <div id="title">👑 משחק הממלכה<small>בנו עיר חרדית על פי התורה</small></div>

    <div class="stats">
      <div class="stat"><span class="lbl">💰 כסף</span><b id="sMoney">0</b></div>
      <div class="stat"><span class="lbl">👨‍👩‍👧 תושבים</span><b id="sPop">0</b></div>
      <div class="stat"><span class="lbl">😊 שמחה</span><b id="sHappy">0</b></div>
      <div class="stat"><span class="lbl">💵 הכנסה לחודש</span><b id="sIncome">0</b></div>
    </div>

    <div id="torahBox">
      <div class="lbl" style="font-size:12px; color:var(--gold);">📜 רמת התורה בעיר</div>
      <div id="torahBar"><div id="torahFill"></div></div>
      <div id="torahTxt">50%</div>
    </div>

    <div class="section-title">🏗️ בנו בעיר (לחצו ואז על המפה)</div>
    <div id="palette"></div>
    <div id="delMode">🗑️ מצב הריסה (כבוי)</div>

    <div id="time">
      <div id="clock">שנה <b id="sYear">5784</b> · <span id="sMonth">תשרי</span></div>
      <div id="speedRow">
        <div class="spd" data-spd="0">⏸️</div>
        <div class="spd sel" data-spd="1">🐢</div>
        <div class="spd" data-spd="3">▶️</div>
        <div class="spd" data-spd="8">⏩</div>
        <div class="spd" data-spd="20">🚀</div>
      </div>
      <div class="lbl" style="text-align:center; margin-top:4px; font-size:11px;">לאט ← → מהר (העברת שנים)</div>
    </div>
  </div>

  <!-- ========== MAP ========== -->
  <div id="main">
    <canvas id="canvas"></canvas>
    <div id="weatherIco">☀️</div>
    <div id="hint">בחרו מבנה והניחו אותו על המפה</div>
    <div id="toast"></div>
    <div id="overlay"><div id="event">
      <h2 id="evTitle"></h2>
      <p id="evText"></p>
      <button id="evBtn">בסדר</button>
    </div></div>
  </div>
</div>

<script>
"use strict";
/* =========================================================
   משחק הממלכה — בניית עיר חרדית על פי התורה
   קובץ אחד, ללא אינטרנט. כל הקוד כאן.
   ========================================================= */

// ---------- סוגי המבנים ----------
// torah = כמה המבנה מוסיף לרמת התורה
// income = כסף לחודש, happy = שמחה, pop = כמה תושבים מוסיף
const BUILDINGS = {
  road:    {name:"כביש",        ico:"🛣️", cost:10,   income:0,  happy:0,  pop:0,  torah:0},
  house:   {name:"בית פרטי",    ico:"🏠", cost:100,  income:5,  happy:1,  pop:4,  torah:0},
  shul:    {name:"בית כנסת",    ico:"🕍", cost:200,  income:0,  happy:4,  pop:0,  torah:8},
  midrash: {name:"בית מדרש",    ico:"📖", cost:250,  income:0,  happy:3,  pop:0,  torah:9},
  ttorah:  {name:"תלמוד תורה",  ico:"🏫", cost:220,  income:0,  happy:3,  pop:0,  torah:7},
  mall:    {name:"מרכז מסחרי",  ico:"🏬", cost:400,  income:40, happy:2,  pop:0,  torah:0},
  factory: {name:"מפעל",        ico:"🏭", cost:350,  income:35, happy:-3, pop:0,  torah:0},
  field:   {name:"שדה",         ico:"🌾", cost:60,   income:8,  happy:1,  pop:0,  torah:0},
  park:    {name:"שטח ירוק",    ico:"🌳", cost:80,   income:0,  happy:5,  pop:0,  torah:1},
  police:  {name:"משטרה",       ico:"🚓", cost:300,  income:0,  happy:3,  pop:0,  torah:0},
  mada:    {name:'מד"א',        ico:"🚑", cost:300,  income:0,  happy:3,  pop:0,  torah:1},
  fire:    {name:"מכבי אש",     ico:"🚒", cost:300,  income:0,  happy:3,  pop:0,  torah:0},
  zaka:    {name:'זק"א',        ico:"🚐", cost:280,  income:0,  happy:2,  pop:0,  torah:2},
  cityhall:{name:"בניין העירייה",ico:"🏛️",cost:500,  income:0,  happy:4,  pop:0,  torah:1},
  embassy: {name:"שגרירות",     ico:"🏤", cost:450,  income:0,  happy:2,  pop:0,  torah:0},
  army:    {name:"צבא",         ico:"🪖", cost:400,  income:0,  happy:1,  pop:0,  torah:0},
};

// ---------- מצב המשחק ----------
const COLS=16, ROWS=12, TILE=46;
const HEB_MONTHS=["תשרי","חשון","כסלו","טבת","שבט","אדר","ניסן","אייר","סיון","תמוז","אב","אלול"];

const state = {
  grid: Array.from({length:ROWS},()=>Array(COLS).fill(null)),
  money: 1500,
  pop: 0,
  happy: 50,
  torah: 50,
  income: 0,
  year: 5784,
  month: 0,
  speed: 1,            // 0=עצור,1=לאט ... 20=מהיר מאוד
  selected: null,
  delMode: false,
  weather: "sun",      // sun / rain
  timeOfDay: 0,        // 0..1 (0=בוקר, 0.5=ערב, ...)
  warCooldown: 6,      // כמה חודשים עד שאפשר מלחמה
  drops: [],           // טיפות גשם
};

// ---------- הכנת הלוח (canvas) ----------
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = COLS*TILE;
canvas.height = ROWS*TILE;

// ---------- בניית לוח המבנים בצד ----------
const palette = document.getElementById("palette");
for(const key in BUILDINGS){
  const b = BUILDINGS[key];
  const el = document.createElement("div");
  el.className="bld";
  el.dataset.key=key;
  el.innerHTML = `<span class="ico">${b.ico}</span>${b.name}<span class="cost">₪${b.cost}</span>`;
  el.onclick = ()=>{
    state.delMode=false; updateDelBtn();
    if(state.selected===key){ state.selected=null; }
    else { state.selected=key; }
    refreshPalette();
  };
  palette.appendChild(el);
}
function refreshPalette(){
  document.querySelectorAll(".bld").forEach(el=>{
    el.classList.toggle("sel", el.dataset.key===state.selected);
  });
}

// ---------- מצב הריסה ----------
const delBtn = document.getElementById("delMode");
delBtn.onclick = ()=>{ state.delMode=!state.delMode; if(state.delMode) state.selected=null; refreshPalette(); updateDelBtn(); };
function updateDelBtn(){
  delBtn.classList.toggle("on", state.delMode);
  delBtn.textContent = state.delMode ? "🗑️ מצב הריסה (פעיל)" : "🗑️ מצב הריסה (כבוי)";
}

// ---------- בחירת מהירות זמן ----------
document.querySelectorAll(".spd").forEach(el=>{
  el.onclick=()=>{
    state.speed = Number(el.dataset.spd);
    document.querySelectorAll(".spd").forEach(s=>s.classList.remove("sel"));
    el.classList.add("sel");
  };
});

// ---------- לחיצה על המפה ----------
function tileFromEvent(e){
  const r = canvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * (canvas.width/r.width);
  const y = (e.clientY - r.top)  * (canvas.height/r.height);
  return {col: Math.floor(x/TILE), row: Math.floor(y/TILE)};
}
canvas.addEventListener("pointerdown", e=>{
  const {col,row} = tileFromEvent(e);
  if(col<0||col>=COLS||row<0||row>=ROWS) return;

  if(state.delMode){
    const cell = state.grid[row][col];
    if(cell){ state.grid[row][col]=null; toast("🗑️ נהרס: "+BUILDINGS[cell].name); recalc(); }
    return;
  }
  if(!state.selected){ toast("בחרו קודם מבנה מהתפריט בצד 👈"); return; }
  const b = BUILDINGS[state.selected];
  if(state.grid[row][col]){ toast("המשבצת תפוסה! בחרו מקום ריק."); return; }
  if(state.money < b.cost){ toast("אין מספיק כסף 💰 (חסר ₪"+(b.cost-state.money)+")"); return; }
  state.money -= b.cost;
  state.grid[row][col] = state.selected;
  toast(b.ico+" נבנה "+b.name+"!");
  recalc();
});

// ---------- חישוב כל הנתונים מחדש ----------
function recalc(){
  let income=0, happy=50, pop=0, torahPts=0, holy=0, total=0;
  let hasFactory=false, hasService=0, hasArmy=false, hasEmbassy=false, hasHall=false;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const k=state.grid[r][c];
    if(!k) continue;
    const b=BUILDINGS[k];
    income += b.income; happy += b.happy; pop += b.pop; torahPts += b.torah;
    if(k!=="road") total++;
    if(["shul","midrash","ttorah"].includes(k)) holy++;
    if(k==="factory") hasFactory=true;
    if(["police","mada","fire","zaka"].includes(k)) hasService++;
    if(k==="army") hasArmy=true;
    if(k==="embassy") hasEmbassy=true;
    if(k==="cityhall") hasHall=true;
  }
  // אחזקה: כל מבנה עולה קצת כסף לחודש
  income -= total*2;

  // רמת התורה: יחס המבנים הקדושים + נקודות תורה (0..100)
  let torah = 50 + torahPts - (hasFactory?5:0);
  if(total>0) torah += (holy/total)*30;
  torah = Math.max(0, Math.min(100, torah));

  state.income = income;
  state.pop = pop;
  state.torah = Math.round(torah);
  // השמחה זזה לאט לכיוון היעד (כדי שזה ירגיש חי)
  state._happyTarget = Math.max(0, Math.min(100, happy + (state.torah-50)/3));
  state._hasArmy=hasArmy; state._hasEmbassy=hasEmbassy; state._hasService=hasService; state._hasHall=hasHall;
  render();
  updateUI();
}

// ---------- מעבר חודש (לב המשחק) ----------
let monthTimer=0;
function monthTick(){
  // הכנסה
  state.money += state.income;
  // שמחה זזה לכיוון היעד
  if(state._happyTarget!==undefined){
    state.happy += Math.sign(state._happyTarget-state.happy)*Math.min(2, Math.abs(state._happyTarget-state.happy));
  }
  // גידול אוכלוסייה לפי שמחה (רק אם יש בתים פנויים — pop הוא הקיבולת)
  // (כאן pop = קיבולת הבתים; התושבים בפועל זהים לקיבולת לשם הפשטות)

  // התקדמות הזמן
  state.month++;
  if(state.month>=12){ state.month=0; state.year++; yearEvent(); }

  // מזג אוויר — ככל שרמת התורה גבוהה, יותר גשם של ברכה
  if(Math.random() < 0.15 + state.torah/400){
    state.weather="rain"; makeRain();
  } else if(Math.random()<0.4){
    state.weather="sun"; state.drops=[];
  }

  // אירועים / מלחמות
  state.warCooldown--;
  if(state.warCooldown<=0){ maybeWar(); state.warCooldown = 5 + Math.floor(Math.random()*5); }

  recalc();
}

function yearEvent(){
  // בונוס שנתי לפי רמת התורה
  if(state.torah>=70){
    const bonus = 200 + state.pop*3;
    state.money += bonus;
    showEvent("🎉 שנה טובה ומבורכת!", `בזכות שמירת התורה בעיר, ירדה ברכה גדולה!\nקיבלתם ₪${bonus} וברכת שמיים. ☀️📜`);
  } else if(state.torah<35){
    showEvent("⚠️ שנה קשה", "רמת התורה בעיר נמוכה. כדאי לבנות עוד בתי כנסת, בתי מדרש ותלמודי תורה כדי להביא ברכה לעיר. 🕍📖");
  }
}

// ---------- מלחמה / שלום ----------
function maybeWar(){
  // אם רמת התורה גבוהה — אין מלחמות בכלל!
  if(state.torah>=75){
    if(Math.random()<0.5)
      showEvent("🕊️ שלום ושלווה", "עם ישראל הולך בדרך התורה — ולכן אין שום מלחמה! האויבים פוחדים ובורחים. \"ה' ילחם לכם ואתם תחרישון\". 🕊️📜");
    return;
  }
  // סיכוי למלחמה גדל ככל שהתורה נמוכה
  const risk = (75 - state.torah)/120;
  if(Math.random() > risk) return;

  // פרצה מלחמה
  if(state.torah>=55){
    showEvent("⚔️ ניצחתם במלחמה!", "אויב ניסה לתקוף, אבל בזכות התורה והמצוות — ניצחתם בקלות בלי שום נזק! 'כי ה' אלוקיכם ההולך עמכם להילחם לכם'. 🛡️📜");
  } else if(state._hasArmy){
    state.money = Math.max(0, state.money-150);
    showEvent("⚔️ מלחמה — ניצחתם בעזרת הצבא", "האויב תקף. הצבא הגן על העיר וניצחתם! זה עלה ₪150. כדאי לחזק את התורה כדי שלא יהיו מלחמות בכלל. 🪖");
  } else {
    state.money = Math.max(0, state.money-300);
    state.happy = Math.max(0, state.happy-15);
    showEvent("💥 העיר הותקפה", "לא היה צבא וגם רמת התורה נמוכה. נגרם נזק (₪300 ושמחה ירדה). 🛡️ בנו צבא, ובעיקר חזקו את התורה בעיר — בתי כנסת, בתי מדרש ותלמודי תורה!");
  }
}

// ---------- גשם ----------
function makeRain(){
  state.drops=[];
  for(let i=0;i<60;i++)
    state.drops.push({x:Math.random()*canvas.width, y:Math.random()*canvas.height, s:2+Math.random()*3});
}

// ---------- ציור המפה ----------
function render(){
  // רקע דשא
  ctx.fillStyle="#7ec850";
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // משבצות
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++){
    const x=c*TILE, y=r*TILE;
    // קו רשת עדין
    ctx.strokeStyle="#6cb544"; ctx.strokeRect(x,y,TILE,TILE);
    const k=state.grid[r][c];
    if(k){
      if(k==="road"){ ctx.fillStyle="#7d7d85"; ctx.fillRect(x+2,y+2,TILE-4,TILE-4); }
      else {
        // ריבוע מבנה רך
        ctx.fillStyle="#ffffff22";
        ctx.fillRect(x+3,y+3,TILE-6,TILE-6);
      }
      ctx.font="28px serif"; ctx.textAlign="center"; ctx.textBaseline="middle";
      ctx.fillText(BUILDINGS[k].ico, x+TILE/2, y+TILE/2+2);
    }
  }

  // הדגשת המבנה הנבחר תחת העכבר אפשר להוסיף בהמשך

  // שכבת לילה/יום
  const t = state.timeOfDay; // 0..1
  let nightAlpha = 0;
  if(t>0.5){ nightAlpha = Math.min(0.55,(t-0.5)*1.4); } // אחה"צ->לילה
  if(nightAlpha>0){
    ctx.fillStyle=`rgba(10,15,45,${nightAlpha})`;
    ctx.fillRect(0,0,canvas.width,canvas.height);
  }

  // גשם
  if(state.weather==="rain"){
    ctx.strokeStyle="#bfe3ff"; ctx.lineWidth=2;
    for(const d of state.drops){
      ctx.beginPath(); ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-2,d.y+8); ctx.stroke();
    }
  }
}

// ---------- עדכון הטקסט בצד ----------
function updateUI(){
  document.getElementById("sMoney").textContent = Math.round(state.money).toLocaleString();
  document.getElementById("sPop").textContent = state.pop;
  document.getElementById("sHappy").textContent = Math.round(state.happy)+"%";
  const inc=Math.round(state.income);
  const incEl=document.getElementById("sIncome");
  incEl.textContent=(inc>=0?"+":"")+inc; incEl.style.color = inc>=0?"#3fb950":"#e5534b";
  document.getElementById("sYear").textContent = state.year;
  document.getElementById("sMonth").textContent = HEB_MONTHS[state.month];
  const tf=document.getElementById("torahFill");
  tf.style.width = state.torah+"%";
  let lvl = state.torah>=75?"עיר של תורה! 🕊️ אין מלחמות":
            state.torah>=55?"מצב טוב 📜":
            state.torah>=35?"בינוני — חזקו את התורה":"נמוך! בנו מוסדות תורה ⚠️";
  document.getElementById("torahTxt").textContent = state.torah+"% — "+lvl;
  document.getElementById("weatherIco").textContent = state.weather==="rain"?"🌧️":(state.timeOfDay>0.6?"🌙":"☀️");
}

// ---------- הודעה קטנה ----------
let toastTimer=0;
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove("show"),2200);
}

// ---------- חלון אירוע גדול ----------
let evPaused=false;
function showEvent(title,text){
  document.getElementById("evTitle").textContent=title;
  document.getElementById("evText").textContent=text;
  document.getElementById("overlay").style.display="flex";
  evPaused=true;
}
document.getElementById("evBtn").onclick=()=>{
  document.getElementById("overlay").style.display="none";
  evPaused=false;
};

// ---------- לולאת המשחק ----------
let last=performance.now();
function loop(now){
  const dt=(now-last)/1000; last=now;
  if(state.speed>0 && !evPaused){
    // קצב הזמן: כל "חודש" אורך פחות ככל שהמהירות גבוהה
    monthTimer += dt*state.speed;
    const secsPerMonth = 1.5; // בלאט (speed=1): חודש כל 1.5 שניות
    while(monthTimer >= secsPerMonth){
      monthTimer -= secsPerMonth;
      monthTick();
    }
    // מחזור יום/לילה
    state.timeOfDay = (state.timeOfDay + dt*state.speed*0.05) % 1;
    // הזזת טיפות גשם
    if(state.weather==="rain"){
      for(const d of state.drops){
        d.y += d.s*dt*120; d.x -= dt*20;
        if(d.y>canvas.height){ d.y=-5; d.x=Math.random()*canvas.width; }
      }
    }
  }
  render();
  requestAnimationFrame(loop);
}

// ---------- התחלה ----------
function start(){
  updateDelBtn();
  recalc();
  showEvent("👑 ברוכים הבאים למשחק הממלכה!",
    "אתם ראש העיר! בנו עיר חרדית יפה: בתים, מפעלים, מרכז מסחרי, ובעיקר — בתי כנסת, בתי מדרש ותלמודי תורה.\n\nככל שתלכו לפי התורה, רמת התורה תעלה — וכשהיא גבוהה, לא יהיו מלחמות בכלל ותקבלו ברכה! 📜☀️\n\nאפשר להאיץ או להאט את הזמן עם הכפתורים למטה. בהצלחה!");
  requestAnimationFrame(loop);
}
start();
</script>
